# =============================================================================
# RestaurantApi - API servisleri (compose.yaml'daki altyapıyla birlikte kullanılır)
#
# compose.yaml servis adları: postgres, cache (Redis), minio, createbuckets, seq
#
# Kullanım (komutlar proje kök dizininden çalıştırılır):
#
#   Prod benzeri : docker compose -f compose.yaml -f compose.api.yaml --profile dev --profile app up -d --build
#   Hot reload   : docker compose -f compose.yaml -f compose.api.yaml --profile dev --profile app-dev up --build --watch
#   Dev durdur   : docker compose -f compose.yaml -f compose.api.yaml --profile dev --profile app-dev down
#   Prod durdur  : docker compose -f compose.yaml -f compose.api.yaml --profile dev --profile app down
#
#   Sadece API durdurmak (altyapı çalışmaya devam eder):
#   Dev API      : docker compose -f compose.yaml -f compose.api.yaml stop api-dev
#   Prod API     : docker compose -f compose.yaml -f compose.api.yaml stop api
#
# Not: Hot reload komutunda -d kullanılmaz. down komutunda -v kullanılmadığı
# sürece PostgreSQL, Redis, MinIO ve Seq volume verileri korunur.
#
# Ayarlar .env dosyasından gelir (.env.example'ı kopyala). Konteynerde user secrets
# otomatik okunmaz; ASP.NET Core ayarları ortam değişkenlerinden alır
# ("__" iç içe anahtar demektir).
# =============================================================================

x-api-environment: &api-environment
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=restaurant-api;Username=${POSTGRES_USER:-user};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}"
  ConnectionStrings__Redis: "cache:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD gerekli}"

  AWS__ServiceUrl: "http://minio:9000"
  AWS__AccessKey: "${MINIO_ROOT_USER:?MINIO_ROOT_USER gerekli}"
  AWS__SecretKey: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD gerekli}"
  AWS__Region: "eu-west-1"
  AWS__Bucket: "images-bucket"
  AWS__PublicBaseUrl: "http://localhost:9000"

  JwtSettings__SecretKey: "${JWT_SECRET_KEY:?JWT_SECRET_KEY gerekli}"
  JwtSettings__Issuer: "restaurant-api"
  JwtSettings__Audience: "restaurant-api-client"
  JwtSettings__AccessTokenExpirationMinutes: "15"
  JwtSettings__RefreshTokenExpirationDays: "7"

  MailSettings__Host: "${MAIL_HOST:-smtp.gmail.com}"
  MailSettings__Port: "${MAIL_PORT:-587}"
  MailSettings__Email: "${MAIL_EMAIL:?MAIL_EMAIL gerekli}"
  MailSettings__Password: "${MAIL_PASSWORD:?MAIL_PASSWORD gerekli}"
  
  Stripe__SecretKey: "${Stripe__SecretKey:? Stripe__SecretKey gerekli}"
  Stripe__WebhookSecret: "${Stripe__WebhookSecret:? Stripe__WebhookSecret gerekli}"
  Stripe__SuccessUrl: "${Stripe__SuccessUrl:? Stripe__SuccessUrl gerekli}"
  Stripe__CancelUrl: "${Stripe__CancelUrl:? Stripe__CancelUrl gerekli}"
  Stripe__Currency: "${Stripe__Currency:? Stripe__Currency gerekli}"
  
  RootAdmin__Email: "${AdminMail:? Admin Email Gerekli}"
  RootAdmin__Password: "${AdminPassword:? Admin Password Gerekli}"
  RootAdmin__PhoneNumber: "${AdminPhone:? Admin Phone Gerekli}"
  
  Cors__AllowedOrigins__0: "${Cors__AllowedOrigins__0:-*}"
  
  # ===== RateLimiting =====
  RateLimiting__Enabled: "${RateLimiting__Enabled:-true}"

  # ----- Auth -----
  RateLimiting__Auth__Register__PermitLimit: "${RateLimiting__Auth__Register__PermitLimit:-10}"
  RateLimiting__Auth__Register__WindowSeconds: "${RateLimiting__Auth__Register__WindowSeconds:-60}"

  RateLimiting__Auth__General__PermitLimit: "${RateLimiting__Auth__General__PermitLimit:-15}"
  RateLimiting__Auth__General__WindowSeconds: "${RateLimiting__Auth__General__WindowSeconds:-60}"

  RateLimiting__Auth__Refresh__PermitLimit: "${RateLimiting__Auth__Refresh__PermitLimit:-50}"
  RateLimiting__Auth__Refresh__WindowSeconds: "${RateLimiting__Auth__Refresh__WindowSeconds:-60}"

  RateLimiting__Auth__MailVerify__PermitLimit: "${RateLimiting__Auth__MailVerify__PermitLimit:-15}"
  RateLimiting__Auth__MailVerify__WindowSeconds: "${RateLimiting__Auth__MailVerify__WindowSeconds:-60}"

  # ----- Password -----
  RateLimiting__Password__ChangeVerify__PermitLimit: "${RateLimiting__Password__ChangeVerify__PermitLimit:-15}"
  RateLimiting__Password__ChangeVerify__WindowSeconds: "${RateLimiting__Password__ChangeVerify__WindowSeconds:-300}"

  RateLimiting__Password__ChangeApply__PermitLimit: "${RateLimiting__Password__ChangeApply__PermitLimit:-15}"
  RateLimiting__Password__ChangeApply__WindowSeconds: "${RateLimiting__Password__ChangeApply__WindowSeconds:-300}"

  # ----- SameUser -----
  RateLimiting__SameUser__Standard__PermitLimit: "${RateLimiting__SameUser__Standard__PermitLimit:-50}"
  RateLimiting__SameUser__Standard__WindowSeconds: "${RateLimiting__SameUser__Standard__WindowSeconds:-60}"

  RateLimiting__SameUser__Strict__PermitLimit: "${RateLimiting__SameUser__Strict__PermitLimit:-30}"
  RateLimiting__SameUser__Strict__WindowSeconds: "${RateLimiting__SameUser__Strict__WindowSeconds:-60}"

  RateLimiting__SameUser__Restricted__PermitLimit: "${RateLimiting__SameUser__Restricted__PermitLimit:-50}"
  RateLimiting__SameUser__Restricted__WindowSeconds: "${RateLimiting__SameUser__Restricted__WindowSeconds:-60}"

  RateLimiting__SameUser__Critical__PermitLimit: "${RateLimiting__SameUser__Critical__PermitLimit:-30}"
  RateLimiting__SameUser__Critical__WindowSeconds: "${RateLimiting__SameUser__Critical__WindowSeconds:-60}"

  RateLimiting__SameUser__Flexible__PermitLimit: "${RateLimiting__SameUser__Flexible__PermitLimit:-50}"
  RateLimiting__SameUser__Flexible__WindowSeconds: "${RateLimiting__SameUser__Flexible__WindowSeconds:-60}"

  # ----- Panel -----
  RateLimiting__Panel__GeneralRead__PermitLimit: "${RateLimiting__Panel__GeneralRead__PermitLimit:-100}"
  RateLimiting__Panel__GeneralRead__WindowSeconds: "${RateLimiting__Panel__GeneralRead__WindowSeconds:-60}"

  RateLimiting__Panel__Put__PermitLimit: "${RateLimiting__Panel__Put__PermitLimit:-30}"
  RateLimiting__Panel__Put__WindowSeconds: "${RateLimiting__Panel__Put__WindowSeconds:-60}"

  RateLimiting__Panel__GeneralPost__PermitLimit: "${RateLimiting__Panel__GeneralPost__PermitLimit:-50}"
  RateLimiting__Panel__GeneralPost__WindowSeconds: "${RateLimiting__Panel__GeneralPost__WindowSeconds:-60}"

  RateLimiting__Panel__GeneralPatch__PermitLimit: "${RateLimiting__Panel__GeneralPatch__PermitLimit:-50}"
  RateLimiting__Panel__GeneralPatch__WindowSeconds: "${RateLimiting__Panel__GeneralPatch__WindowSeconds:-60}"

  RateLimiting__Panel__GeneralDelete__PermitLimit: "${RateLimiting__Panel__GeneralDelete__PermitLimit:-50}"
  RateLimiting__Panel__GeneralDelete__WindowSeconds: "${RateLimiting__Panel__GeneralDelete__WindowSeconds:-60}"

  RateLimiting__Panel__StrictPatch__PermitLimit: "${RateLimiting__Panel__StrictPatch__PermitLimit:-50}"
  RateLimiting__Panel__StrictPatch__WindowSeconds: "${RateLimiting__Panel__StrictPatch__WindowSeconds:-60}"

  RateLimiting__Panel__FlexiblePatch__PermitLimit: "${RateLimiting__Panel__FlexiblePatch__PermitLimit:-50}"
  RateLimiting__Panel__FlexiblePatch__WindowSeconds: "${RateLimiting__Panel__FlexiblePatch__WindowSeconds:-60}"
  
  RateLimiting__Panel__Order__PermitLimit: "${RateLimiting__Panel__Order__PermitLimit:-60}"
  RateLimiting__Panel__Order__WindowSeconds: "${RateLimiting__Panel__Order__WindowSeconds:-60}"

  # ----- Cart -----
  RateLimiting__Cart__GeneralCart__PermitLimit: "${RateLimiting__Cart__GeneralCart__PermitLimit:-150}"
  RateLimiting__Cart__GeneralCart__WindowSeconds: "${RateLimiting__Cart__GeneralCart__WindowSeconds:-60}"

  RateLimiting__Cart__UserRemoveCart__PermitLimit: "${RateLimiting__Cart__UserRemoveCart__PermitLimit:-100}"
  RateLimiting__Cart__UserRemoveCart__WindowSeconds: "${RateLimiting__Cart__UserRemoveCart__WindowSeconds:-60}"

  # ----- Checkout -----
  RateLimiting__Checkout__HybridPanel__PermitLimit: "${RateLimiting__Checkout__HybridPanel__PermitLimit:-100}"
  RateLimiting__Checkout__HybridPanel__WindowSeconds: "${RateLimiting__Checkout__HybridPanel__WindowSeconds:-60}"
  
  RateLimiting__Checkout__User__PermitLimit: "${RateLimiting__Checkout__User__PermitLimit:-50}"
  RateLimiting__Checkout__User__WindowSeconds: "${RateLimiting__Checkout__User__WindowSeconds:-60}"

  # ----- Order -----
  RateLimiting__Order__HybridPanel__PermitLimit: "${RateLimiting__Order__HybridPanel__PermitLimit:-150}"
  RateLimiting__Order__HybridPanel__WindowSeconds: "${RateLimiting__Order__HybridPanel__WindowSeconds:-60}"

  # ----- Categories -----
  RateLimiting__Categories__GetCategories__PermitLimit: "${RateLimiting__Categories__GetCategories__PermitLimit:-100}"
  RateLimiting__Categories__GetCategories__WindowSeconds: "${RateLimiting__Categories__GetCategories__WindowSeconds:-60}"

  # ----- Public -----
  RateLimiting__Public__Flexible__PermitLimit: "${RateLimiting__Public__Flexible__PermitLimit:-100}"
  RateLimiting__Public__Flexible__WindowSeconds: "${RateLimiting__Public__Flexible__WindowSeconds:-60}"
  

x-api-depends-on: &api-depends-on
  postgres:
    condition: service_healthy
  cache:
    condition: service_healthy
  minio:
    condition: service_started
  createbuckets:
    condition: service_completed_successfully
    
services:
  api-dev:
    profiles:
      - app-dev
    build:
      context: .
      dockerfile: src/RestaurantApi.WebApi/Dockerfile
      target: development
    ports:
      - "5269:8080"
    environment:
      <<: *api-environment
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    depends_on: *api-depends-on
    restart: on-failure
    develop:
      watch:
        - action: sync
          path: ./src
          target: /src/src
          ignore:
            - "**/bin/"
            - "**/obj/"
            - "**/*.csproj"
        - action: rebuild
          path: ./src
          include:
            - "**/*.csproj"